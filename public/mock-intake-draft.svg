<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900" role="img" aria-labelledby="title desc">
  <title id="title">Mock Intake Draft</title>
  <desc id="desc">A paper-style field intake draft with handwritten-style disaster relief notes for OCR and approval-queue demos.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e5"/>
      <stop offset="100%" stop-color="#efe6d5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0a0a0c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="1900" fill="#c8d2db"/>
  <rect x="90" y="70" width="1220" height="1760" rx="28" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="145" y="140" width="1110" height="58" rx="14" fill="#20354d"/>
  <text x="180" y="180" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f5f7fb">Community Emergency Intake Form</text>

  <text x="170" y="250" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#263238">Field Report Metadata</text>
  <line x1="170" y1="268" x2="1220" y2="268" stroke="#b8ab94" stroke-width="2"/>

  <text x="175" y="330" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5d5a57">Record Title / Need</text>
  <rect x="170" y="350" width="1050" height="72" rx="14" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>
  <text x="195" y="397" font-family="Brush Script MT, Segoe Script, cursive" font-size="34" fill="#1d3557">Flood relief hygiene kit distribution at Sector 7 camp</text>

  <text x="175" y="470" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5d5a57">Location / Address</text>
  <rect x="170" y="490" width="510" height="72" rx="14" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>
  <text x="195" y="537" font-family="Brush Script MT, Segoe Script, cursive" font-size="32" fill="#2c3e50">Ward 11 Relief Camp, East River School</text>

  <text x="715" y="470" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5d5a57">Category</text>
  <rect x="710" y="490" width="240" height="72" rx="14" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>
  <text x="738" y="537" font-family="Brush Script MT, Segoe Script, cursive" font-size="32" fill="#2c3e50">Food</text>

  <text x="985" y="470" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5d5a57">Urgency</text>
  <rect x="980" y="490" width="240" height="72" rx="14" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>
  <text x="1008" y="537" font-family="Brush Script MT, Segoe Script, cursive" font-size="32" fill="#a61b1b">Critical</text>

  <text x="170" y="625" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#263238">Handwritten Field Notes</text>
  <line x1="170" y1="642" x2="1220" y2="642" stroke="#b8ab94" stroke-width="2"/>

  <rect x="170" y="670" width="1050" height="640" rx="18" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>

  <g font-family="Brush Script MT, Segoe Script, cursive" font-size="31" fill="#22334a">
    <text x="195" y="735">Families displaced after last night's flood surge are short on dry ration packs.</text>
    <text x="195" y="790">Camp volunteers report children and older adults have missed two meal cycles.</text>
    <text x="195" y="845">Immediate request: ready-to-eat kits, bottled water, and queue management support.</text>
    <text x="195" y="900">Local kitchen has supplies for only one more serving window.</text>
    <text x="195" y="955">Road access open from north entrance. Best unloading time before 6 PM.</text>
    <text x="195" y="1010">Community teacher on-site can coordinate beneficiary list if a lead arrives.</text>
    <text x="195" y="1065">Recommend at least 8 volunteers for distribution, sorting, and crowd flow.</text>
    <text x="195" y="1120">Priority should remain high until evening resupply is confirmed.</text>
  </g>

  <text x="175" y="1375" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5d5a57">Volunteers Needed</text>
  <rect x="170" y="1395" width="220" height="72" rx="14" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>
  <text x="265" y="1442" text-anchor="middle" font-family="Brush Script MT, Segoe Script, cursive" font-size="34" fill="#2c3e50">8</text>

  <text x="435" y="1375" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5d5a57">Reported By</text>
  <rect x="430" y="1395" width="360" height="72" rx="14" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>
  <text x="455" y="1442" font-family="Brush Script MT, Segoe Script, cursive" font-size="32" fill="#2c3e50">Nadia, Community Relief Lead</text>

  <text x="835" y="1375" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5d5a57">Submission Source</text>
  <rect x="830" y="1395" width="390" height="72" rx="14" fill="#fbf8f2" stroke="#c4b79f" stroke-width="2"/>
  <text x="855" y="1442" font-family="Brush Script MT, Segoe Script, cursive" font-size="32" fill="#2c3e50">Scanned field notebook page</text>

  <text x="170" y="1545" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#263238">Coordinator Margin Notes</text>
  <line x1="170" y1="1562" x2="1220" y2="1562" stroke="#b8ab94" stroke-width="2"/>
  <rect x="170" y="1590" width="1050" height="150" rx="18" fill="#fff9ec" stroke="#cfbe9d" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="195" y="1660" font-family="Brush Script MT, Segoe Script, cursive" font-size="32" fill="#5a3f2c">Check available stock at Harbor Point warehouse before dispatching volunteer team.</text>

  <text x="170" y="1790" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7f776d">Mock draft for OCR, approval queue, and intake workflow demos</text>
  <text x="1220" y="1790" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7f776d">ResourceSync prototype asset</text>
</svg>
